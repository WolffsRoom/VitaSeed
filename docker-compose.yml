version: '3.8'

services:
  vitaseed-app:
    build: .
    container_name: vitaseed_web
    restart: always
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=sqlite:///data/vitaseed.db
    volumes:
      - ./data:/data
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  default:
    name: vitaseed-network
